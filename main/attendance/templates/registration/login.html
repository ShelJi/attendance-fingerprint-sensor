<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Attendance System</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;

            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.08);

            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.3);

            --danger: #ef4444;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* Background */
        body::before {
            content: "";
            position: fixed;
            inset: -50%;

            background:
                radial-gradient(
                    circle at 20% 80%,
                    rgba(99, 102, 241, 0.12),
                    transparent 45%
                ),
                radial-gradient(
                    circle at 80% 20%,
                    rgba(139, 92, 246, 0.10),
                    transparent 45%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    rgba(59, 130, 246, 0.05),
                    transparent 50%
                );

            animation: backgroundMove 20s ease-in-out infinite;

            z-index: -1;
        }

        @keyframes backgroundMove {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(2%, -2%);
            }
        }

        /* Login wrapper */
        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 24px;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo h1 {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo h1 span {
            background: linear-gradient(
                135deg,
                var(--accent-light),
                #a78bfa
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            margin-top: 7px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* Card */
        .login-card {
            background: var(--glass-bg);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid var(--glass-border);
            border-radius: 18px;

            padding: 32px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);

            animation: cardIn 0.4s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .login-description {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 26px;
        }

        /* Django form */
        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;

            margin-bottom: 8px;

            color: var(--text-secondary);

            font-size: 12px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        form input {
            width: 100%;

            padding: 12px 14px;

            background: rgba(255, 255, 255, 0.04);

            border: 1px solid var(--glass-border);
            border-radius: 10px;

            color: var(--text-primary);

            font-family: inherit;
            font-size: 14px;

            outline: none;

            transition: 0.2s ease;
        }

        form input:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 3px var(--accent-glow);
        }

        form input::placeholder {
            color: var(--text-muted);
        }

        /* Error messages */
        .errorlist {
            list-style: none;

            margin: 6px 0 0;
            padding: 0;

            color: var(--danger);

            font-size: 12px;
        }

        .errorlist li {
            margin-bottom: 3px;
        }

        /* Non-field errors */
        form > .errorlist {
            margin-bottom: 16px;
            padding: 10px 12px;

            background: rgba(239, 68, 68, 0.08);

            border: 1px solid rgba(239, 68, 68, 0.18);
            border-radius: 8px;
        }

        /* Button */
        button {
            width: 100%;

            border: none;
            border-radius: 10px;

            padding: 12px 18px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    #7c3aed
                );

            color: white;

            font-family: inherit;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 4px 15px var(--accent-glow);

            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 7px 22px var(--accent-glow);
        }

        button:active {
            transform: translateY(0);
        }

        /* Footer */
        .login-footer {
            text-align: center;

            margin-top: 20px;

            color: var(--text-muted);

            font-size: 11px;
        }

        /* Mobile */
        @media (max-width: 480px) {
            .login-wrapper {
                padding: 16px;
            }

            .login-card {
                padding: 24px;
            }

            .logo h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="logo">
        <h1>
            <span>Shelj</span> Attendance
        </h1>

        <p>Fingerprint Attendance Management System</p>
    </div>

    <div class="login-card">

        <h2>Welcome back</h2>

        <p class="login-description">
            Sign in to access the attendance management system.
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.non_field_errors }}

            {{ form.as_p }}

            <button type="submit">
                Login
            </button>

        </form>

    </div>

    <div class="login-footer">
        Attendance System
    </div>

</div>

</body>
</html>
