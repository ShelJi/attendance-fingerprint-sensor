<!DOCTYPE html>
<html>
<head>
    <title>Create Employee</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .errorlist {
            color: red;
            padding-left: 0;
            list-style: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <a
        class="back"
        href="{% url 'employee_list' %}"
    >
        ← Back to Employees
    </a>

    <h1>Create Employee</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}

            <div class="field">

                {{ field.label_tag }}

                {{ field }}

                {{ field.errors }}

            </div>

        {% endfor %}

        <button type="submit">
            Create Employee
        </button>

    </form>

</div>

</body>
</html>
